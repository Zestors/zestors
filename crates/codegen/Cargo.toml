[package]
name = "zestors-codegen"
version = "0.2.0"
edition = "2021"
repository = "https://github.com/Zestors/zestors"
homepage = "https://github.com/Zestors/zestors"
authors = ["Jasper van der Werf"]
license = "MIT OR Apache-2.0"
description = "Derive macros for the zestors actor framework"
keywords = ["actor", "actor-system", "tokio"]
categories = ["concurrency"]
readme = "README.md"

[dependencies]
syn = { version = "3", features = ["full"] }
quote = "1"
darling = { version = "0.24" }
uuid = { version = "1", features = ["v4"] }
proc-macro2 = "1"

[dev-dependencies]
zestors-interface = { path = "../interface" }
zestors-distr = { path = "../distr" }

[package.metadata.cargo-machete]
ignored = ["zestors-interface", "zestors-distr"] # only used in doctests

[lib]
proc-macro = true
