[package]
name = "zestors"
version = "0.3.0"
edition = "2024"
readme = "README.md"
description = "An actor framework with Erlang/OTP-style supervision and clustering"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
zestors-supervision.workspace = true
zestors-runtime.workspace = true
zestors-actor.workspace = true
zestors-api-server.workspace = true
zestors-codegen.workspace = true
zestors-interface.workspace = true
zestors-supervisor.workspace = true
zestors-distr = { workspace = true, optional = true }
zestors-distr-quic = { workspace = true, optional = true }

[dev-dependencies]
tracing-subscriber.workspace = true
tokio.workspace = true
futures.workspace = true
tracing.workspace = true
rootcause.workspace = true
serde.workspace = true

[features]
# Only for rust-analyzer in this workspace (see .vscode/settings.json), so that
# feature-gated code is checked. Not meant to be enabled by users.
_ra = ["distr", "auto-register"]
# Distributed mode: the `distr` and `distr_quic` modules, and their items in the
# prelude. Not production ready yet; off by default.
distr = ["dep:zestors-distr", "dep:zestors-distr-quic"]
# `ClusterConfig::auto_register`: registers every remote message in the binary.
auto-register = ["distr", "zestors-distr/auto-register"]

# The cluster examples need distributed mode.
[[example]]
name = "remote"
required-features = ["distr"]

[[example]]
name = "cluster"
required-features = ["distr"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
