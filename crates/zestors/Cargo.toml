[package]
name = "zestors"
version = "0.2.0"
edition = "2024"
readme = "README.md"
description = "An actor framework with Erlang/OTP-style supervision and clustering"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
zestors-supervision.workspace = true
zestors-runtime.workspace = true
zestors-actor.workspace = true
zestors-api-server.workspace = true
zestors-codegen.workspace = true
zestors-interface.workspace = true
zestors-supervisor.workspace = true
zestors-distr.workspace = true
zestors-distr-quic.workspace = true

[dev-dependencies]
tracing-subscriber.workspace = true
tokio.workspace = true
futures.workspace = true
tracing.workspace = true
rootcause.workspace = true
serde.workspace = true

[features]
# Only for rust-analyzer in this workspace (see .vscode/settings.json), so that
# feature-gated code is checked. Not meant to be enabled by users.
_ra = ["auto-register"]
# `ClusterConfig::auto_register`: registers every remote message in the binary.
auto-register = ["zestors-distr/auto-register"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
