[package]
name = "zestors-distr"
version = "0.3.0"
edition = "2024"
readme = "README.md"
description = "Distributed messaging for the zestors actor framework"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
zestors-runtime.workspace = true
zestors-interface.workspace = true
zestors-actor.workspace = true
zestors-supervision.workspace = true
zestors-supervisor.workspace = true
zestors-codegen.workspace = true
zestors-distr-backend.workspace = true
uuid = { workspace = true, features = ["serde"] }
serde.workspace = true
tokio.workspace = true
tracing.workspace = true
thiserror.workspace = true
rand.workspace = true
foca.workspace = true
bytes.workspace = true
dashmap.workspace = true
indexmap.workspace = true
postcard = { version = "1.1", features = ["use-std"] }
type-sets.workspace = true
tokio-util = { version = "0.7", features = ["time"] }
jiff.workspace = true
inventory = { workspace = true, optional = true }

[dev-dependencies]
zestors = { path = "../zestors" } # path-only: stripped on publish, as `zestors` depends on this crate
tracing-subscriber.workspace = true
zestors-distr-quic = { path = "../distr-quic" }
rcgen.workspace = true
tokio = { workspace = true, features = ["test-util"] }
futures.workspace = true
# Enables the `sim` feature for this crate's own tests.
zestors-distr = { path = ".", features = ["sim", "auto-register"] }

[features]
# Only for rust-analyzer in this workspace (see .vscode/settings.json), so that
# feature-gated code is checked. Not meant to be enabled by users.
_ra = ["auto-register"]
# `ClusterConfig::auto_register`: registers every message type in the binary
# that derives `StableId` and is a `RemoteMessage`.
auto-register = ["dep:inventory"]
# In-process simulated clusters for tests, see the `sim` module.
sim = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
