[package]
name = "zestors-distr"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
readme = "README.md"
description = "Distributed messaging for the zestors actor framework"
repository = "https://github.com/Zestors/zestors"

[dependencies]
zestors-runtime.workspace = true
zestors-interface.workspace = true
zestors-actor.workspace = true
zestors-supervision.workspace = true
zestors-supervisor.workspace = true
zestors-codegen.workspace = true
uuid = { workspace = true, features = ["serde"] }
serde.workspace = true
smol_str.workspace = true
tokio.workspace = true
tracing.workspace = true
thiserror.workspace = true
rand.workspace = true
quinn = { workspace = true, optional = true }
foca.workspace = true
bytes.workspace = true
postcard = { version = "1.1", features = ["use-std"] }
type-sets.workspace = true
tokio-util = { version = "0.7", features = ["time"] }
rcgen = { workspace = true, optional = true }
rustls-webpki = { workspace = true, optional = true }

[dev-dependencies]
zestors.workspace = true
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["test-util"] }
# Enables the `sim` feature for this crate's own tests.
zestors-distr = { path = ".", default-features = false, features = ["sim"] }

[features]
default = ["quic"]
# The QUIC backend, see `backend::Quic`.
quic = ["dep:quinn", "dep:rcgen", "dep:rustls-webpki"]
_ra = []
# In-process simulated clusters for tests, see `sim`.
sim = []

[[test]]
name = "cluster"
required-features = ["quic"]

[[test]]
name = "remote_quic"
required-features = ["quic"]
