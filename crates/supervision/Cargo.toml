[package]
name = "zestors-supervision"
version = "0.3.0"
edition = "2024"
readme = "README.md"
description = "Supervision-tree building blocks for the zestors actor framework"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
zestors-runtime.workspace = true
zestors-actor.workspace = true
zestors-codegen.workspace = true
zestors-interface.workspace = true
futures.workspace = true
tracing.workspace = true
rootcause.workspace = true
thiserror.workspace = true
tokio.workspace = true
serde.workspace = true
smol_str.workspace = true
jiff.workspace = true

[dev-dependencies]
zestors = { path = "../zestors" }

[package.metadata.cargo-machete]
# zestors: only used in doctests.
# zestors-interface: referenced by string in `#[msg(path = "zestors_interface")]`.
ignored = ["zestors", "zestors-interface"]